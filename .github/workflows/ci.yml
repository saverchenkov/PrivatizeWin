name: CI & Release Build

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: Build & Test (x64 Release)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSVC developer environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Setup Ninja
        uses: ashutoshvarma/setup-ninja@master
        with:
          version: 1.11.1

      - name: Configure CMake
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON

      - name: Build PrivatizeWin and Tests
        run: |
          cmake --build build --config Release

      - name: Run Automated Test Suite (CTest)
        run: |
          ctest --test-dir build -C Release --output-on-failure

      - name: Prepare Release Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist -Force
          Copy-Item build/PrivatizeWin.exe dist/PrivatizeWin.exe
          Copy-Item -Recurse templates dist/templates
          Copy-Item README.md dist/README.md
          if (Test-Path LICENSE) { Copy-Item LICENSE dist/LICENSE }
          
          # Create standalone zip
          Compress-Archive -Path dist/* -DestinationPath PrivatizeWin-x64.zip
          
          # Calculate SHA-256
          $hash = (Get-FileHash -Algorithm SHA256 dist/PrivatizeWin.exe).Hash
          "$hash  PrivatizeWin.exe" | Out-File -Encoding utf8 dist/checksums.txt
          "$((Get-FileHash -Algorithm SHA256 PrivatizeWin-x64.zip).Hash)  PrivatizeWin-x64.zip" | Out-File -Encoding utf8 -Append dist/checksums.txt
          Get-Content dist/checksums.txt

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PrivatizeWin-x64
          path: |
            dist/PrivatizeWin.exe
            PrivatizeWin-x64.zip
            dist/checksums.txt

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/PrivatizeWin.exe
            PrivatizeWin-x64.zip
            dist/checksums.txt
          draft: false
          prerelease: false
          generate_release_notes: true
